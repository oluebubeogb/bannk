services:
  postgres:
    image: postgres:16-alpine
    container_name: bannk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bannk
      POSTGRES_PASSWORD: bannk_dev_password
      POSTGRES_DB: bannk
    ports:
      - "5432:5432"
    volumes:
      - bannk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bannk -d bannk"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional — unused in v1
  redis:
    image: redis:7-alpine
    container_name: bannk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bannk_redis:/data

volumes:
  bannk_pgdata:
  bannk_redis:
